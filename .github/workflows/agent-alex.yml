name: Agent — Alex

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 08:00 UTC — video script + carousel
    - cron: '0 8 * * 4'  # Thursday 08:00 UTC — hook A/B test carousel
    - cron: '0 8 * * 0'  # Sunday 08:00 UTC — YouTube Short script
  workflow_dispatch:
    inputs:
      day_override:
        description: 'Override day context (monday/thursday/sunday)'
        required: false

jobs:
  run-alex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install @anthropic-ai/sdk twitter-api-v2

      - name: Run Alex
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_WEBHOOK:     ${{ secrets.FACEBOOK_WEBHOOK }}
          INSTAGRAM_WEBHOOK:    ${{ secrets.INSTAGRAM_WEBHOOK }}
          HCTI_USER_ID:         ${{ secrets.HCTI_USER_ID }}
          HCTI_API_KEY:         ${{ secrets.HCTI_API_KEY }}
          TWITTER_API_KEY:      ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:   ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: node .github/scripts/run-agent.js alex

      - name: Commit memory update
        run: |
          git config user.name  "mealzy-agents[bot]"
          git config user.email "agents@mealzy.org"
          git add .agents/memory/alex.md .agents/outputs/
          git diff --cached --quiet || git commit -m "agent(alex): memory + output $(date -u +%Y-%m-%d)"
          git push
