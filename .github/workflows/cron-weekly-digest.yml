name: Cron — Weekly Digest Emails
on:
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly digest
        run: |
          curl -s -f -X POST https://mealzy.org/api/cron/weekly-digest \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "x-cron-timestamp: $(date +%s%3N)" \
            -H "Content-Type: application/json" \
            -o /tmp/digest-result.json
          cat /tmp/digest-result.json
