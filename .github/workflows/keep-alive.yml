# Mealzy — Render Keep-Alive
# Pings /api/health. Render spins down after 15 min of inactivity.
#
# Manual only. The project is shut down, so this no longer runs on a schedule.
# Run it from the Actions tab if a one-off health check is ever needed.

name: Keep Alive

on:
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Mealzy health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /api/health
        run: |
          echo "Pinging https://www.mealzy.org/api/health ..."
          response=$(curl -s -o /tmp/health.json -w "%{http_code}" https://www.mealzy.org/api/health)
          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/health.json
          if [ "$response" != "200" ]; then
            echo "WARNING: Health check returned $response — server may be down"
            exit 1
          fi
          echo "Server is warm and healthy."
