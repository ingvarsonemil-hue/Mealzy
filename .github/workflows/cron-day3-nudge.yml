name: Cron — Day-3 Nudge Emails
on:
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger day-3 nudge
        run: |
          curl -s -f -X POST https://mealzy.org/api/cron/day3-nudge \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "x-cron-timestamp: $(date +%s%3N)" \
            -H "Content-Type: application/json" \
            -o /tmp/nudge-result.json
          cat /tmp/nudge-result.json
