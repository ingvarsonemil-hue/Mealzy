  digest:
    name: Monday Digest
    runs-on: ubuntu-latest
    needs: [alex, blake, avery, morgan, riley, casey, charlie, harper, logan, maya, quinn, robin, taylor, finlay, matteo, budget-guard, macro-specialist, culinary-critic, grocery-optimizer, drew, growth, contentops]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: .agents/outputs/, merge-multiple: true }
      - name: Build digest
        run: |
          DATE=$(date +%Y-%m-%d)
          OUT=".agents/outputs/${DATE}-digest.md"
          echo "# Monday Digest — ${DATE}" > $OUT
          echo "" >> $OUT
          echo "| Agent | Status |" >> $OUT
          echo "|-------|--------|" >> $OUT
          for a in alex blake avery morgan riley casey charlie harper logan maya quinn robin taylor finlay matteo budget-guard macro-specialist culinary-critic grocery-optimizer drew growth contentops; do
            F=".agents/outputs/${DATE}-${a}.md"
            [ -f "$F" ] && echo "| $a | ✅ |" >> $OUT || echo "| $a | ❌ |" >> $OUT
          done
          cat $OUT
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: monday digest [skip ci]"
          file_pattern: ".agents/outputs/*digest*"