      - uses: actions/upload-artifact@v4
        with: { name: nova-wed, path: .agents/outputs/*nova* }

  # MANUAL — run with: node .github/scripts/run-agent.js quinn
  quinn:
    if: false
    name: Quinn — Prompt Fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
