# .github/workflows/wednesday-agents.yml
# casey, jordan, logan, maya, morgan, nova, quinn, taylor
# budget-guard, macro-specialist, culinary-critic, grocery-optimizer

name: Wednesday Agents

on:
  schedule:
    - cron: '0 7 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  casey:
    name: Casey — Churn Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js casey
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: casey-wed, path: .agents/outputs/*casey* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: casey wednesday [skip ci]"
          file_pattern: ".agents/outputs/*casey* .agents/memory/casey.md"

  jordan:
    name: Jordan — Email Sequence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
