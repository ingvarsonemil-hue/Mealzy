# .github/workflows/wednesday-agents.yml
# PAUSED — taylor: re-enable when Twitter/Reddit account has posting history and 100+ followers
# PAUSED — logan: re-enable when Mealzy has 200+ active users
# PAUSED — maya: re-enable when running paid ads
# MANUAL — casey: run with node .github/scripts/run-agent.js casey
# MANUAL — morgan: run with node .github/scripts/run-agent.js morgan
# MANUAL — quinn: run with node .github/scripts/run-agent.js quinn
# PAUSED — nova: re-enable when there is meaningful site traffic and design improvements are needed for conversion
# PAUSED — grocery-optimizer: re-enable when Pro subscribers are actively using the grocery list feature

name: Wednesday Agents

on:
  schedule:
    - cron: '0 7 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # MANUAL — run with: node .github/scripts/run-agent.js casey
  casey:
    if: false
    name: Casey — Churn Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js casey
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: casey-wed, path: .agents/outputs/*casey* }

  jordan:
    name: Jordan — Email Sequence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js jordan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: jordan-wed, path: .agents/outputs/*jordan* }

  # PAUSED — re-enable when Mealzy has 200+ active users
  logan:
    if: false
    name: Logan — Pipeline Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js logan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: logan-wed, path: .agents/outputs/*logan* }

  # PAUSED — re-enable when running paid ads
  maya:
    if: false
    name: Maya — CRO + Headline Rewrites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js maya
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: maya-wed, path: .agents/outputs/*maya* }

  # MANUAL — run with: node .github/scripts/run-agent.js morgan
  morgan:
    if: false
    name: Morgan — Bug Fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js morgan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: morgan-wed, path: .agents/outputs/*morgan* }

  # PAUSED — re-enable when there is meaningful site traffic and design improvements are needed for conversion
  nova:
    if: false
    name: Nova — Design Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
