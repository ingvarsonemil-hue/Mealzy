# .github/workflows/friday-agents.yml
# All 19 agents deliver weekly reports on Friday + nova ships design fix + skylar viral hooks

name: Friday Agents

on:
  schedule:
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  alex:
    name: Alex — Hook A/B Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js alex
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_WEBHOOK:  ${{ secrets.FACEBOOK_WEBHOOK }}
          INSTAGRAM_WEBHOOK: ${{ secrets.INSTAGRAM_WEBHOOK }}
          HCTI_USER_ID:      ${{ secrets.HCTI_USER_ID }}
          HCTI_API_KEY:      ${{ secrets.HCTI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: alex-fri, path: .agents/outputs/*alex* }
  avery:
    name: Avery — API Cost Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
