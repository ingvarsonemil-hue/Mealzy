# .github/workflows/friday-agents.yml
name: Friday Agents

on:
  schedule:
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  alex:
    name: Alex — Hook A/B Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js alex
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_WEBHOOK:  ${{ secrets.FACEBOOK_WEBHOOK }}
          INSTAGRAM_WEBHOOK: ${{ secrets.INSTAGRAM_WEBHOOK }}
          HCTI_USER_ID:      ${{ secrets.HCTI_USER_ID }}
          HCTI_API_KEY:      ${{ secrets.HCTI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: alex-fri, path: .agents/outputs/*alex* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: alex friday [skip ci]"
          file_pattern: ".agents/outputs/*alex* .agents/memory/alex.md"

  avery:
    name: Avery — API Cost Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js avery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: avery-fri, path: .agents/outputs/*avery* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: avery friday [skip ci]"
          file_pattern: ".agents/outputs/*avery* .agents/memory/avery.md"

  growth:
    name: Growth — Weekly Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js growth
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: growth-fri, path: .agents/outputs/*growth* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: growth friday [skip ci]"
          file_pattern: ".agents/outputs/*growth* .agents/memory/growth.md"

  contentops:
    name: Content Ops — Performance Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js contentops
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: contentops-fri, path: .agents/outputs/*contentops* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: contentops friday [skip ci]"
          file_pattern: ".agents/outputs/*contentops* .agents/memory/contentops.md"