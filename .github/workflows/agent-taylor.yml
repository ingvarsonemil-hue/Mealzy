name: Agent — Taylor

on:
  schedule:
    - cron: '0 9 * * 2'  # Tuesday 09:00 UTC — Twitter thread + community post
    - cron: '0 9 * * 5'  # Friday 09:00 UTC — brand/launch post
  workflow_dispatch:

jobs:
  run-taylor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install @anthropic-ai/sdk twitter-api-v2

      - name: Run Taylor
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_WEBHOOK:     ${{ secrets.FACEBOOK_WEBHOOK }}
          TWITTER_API_KEY:      ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:   ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: node .github/scripts/run-agent.js taylor

      - name: Commit memory update
        run: |
          git config user.name  "mealzy-agents[bot]"
          git config user.email "agents@mealzy.org"
          git add .agents/memory/taylor.md .agents/outputs/
          git diff --cached --quiet || git commit -m "agent(taylor): memory + output $(date -u +%Y-%m-%d)"
          git push
