# .github/workflows/thursday-agents.yml
name: Thursday Agents

on:
  schedule:
    - cron: '0 7 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  casey:
    name: Casey — MRR Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js casey
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: casey, path: .agents/outputs/*casey* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: casey thursday [skip ci]"
          file_pattern: ".agents/outputs/*casey* .agents/memory/casey.md"

  charlie:
    name: Charlie — Support Digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js charlie
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: charlie, path: .agents/outputs/*charlie* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: charlie thursday [skip ci]"
          file_pattern: ".agents/outputs/*charlie* .agents/memory/charlie.md"

  harper:
