      - run: node .github/scripts/run-agent.js jordan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: jordan, path: .agents/outputs/*jordan* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: jordan thursday [skip ci]"
          file_pattern: ".agents/outputs/*jordan* .agents/memory/jordan.md"

  maya:
