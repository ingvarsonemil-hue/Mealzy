    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js harper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: harper-thu, path: .agents/outputs/*harper* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "agents: harper thursday [skip ci]"
          file_pattern: ".agents/outputs/*harper* .agents/memory/harper.md"

  jordan:
