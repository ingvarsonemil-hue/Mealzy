      - run: node .github/scripts/run-agent.js jordan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: jordan-thu, path: .agents/outputs/*jordan* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "agents: jordan thursday [skip ci]"
          file_pattern: ".agents/outputs/*jordan* .agents/memory/jordan.md"

  maya:
    name: Maya — A/B Copy Variants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
