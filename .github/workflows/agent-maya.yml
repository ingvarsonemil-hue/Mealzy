name: Agent — Maya

on:
  schedule:
    - cron: '0 9 * * 3'  # Wednesday 09:00 UTC — ad copy + Facebook post
    - cron: '0 9 * * 6'  # Saturday 09:00 UTC — copy tip post for Twitter
  workflow_dispatch:

jobs:
  run-maya:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install @anthropic-ai/sdk twitter-api-v2

      - name: Run Maya
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_WEBHOOK:     ${{ secrets.FACEBOOK_WEBHOOK }}
          TWITTER_API_KEY:      ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:   ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: node .github/scripts/run-agent.js maya

      - name: Commit memory update
        run: |
          git config user.name  "mealzy-agents[bot]"
          git config user.email "agents@mealzy.org"
          git add .agents/memory/maya.md .agents/outputs/
          git diff --cached --quiet || git commit -m "agent(maya): memory + output $(date -u +%Y-%m-%d)"
          git push
