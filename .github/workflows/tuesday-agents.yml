# .github/workflows/tuesday-agents.yml
# alex, avery, casey, drew, logan, sam, taylor, culinary-critic

name: Tuesday Agents

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  alex:
    name: Alex — Video Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js alex
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_WEBHOOK:  ${{ secrets.FACEBOOK_WEBHOOK }}
          INSTAGRAM_WEBHOOK: ${{ secrets.INSTAGRAM_WEBHOOK }}
          HCTI_USER_ID:      ${{ secrets.HCTI_USER_ID }}
          HCTI_API_KEY:      ${{ secrets.HCTI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: alex-tue, path: .agents/outputs/*alex* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: alex tuesday [skip ci]"
          file_pattern: ".agents/outputs/*alex* .agents/memory/alex.md"

  avery:
    name: Avery — PageSpeed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js avery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: avery-tue, path: .agents/outputs/*avery* }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          push_options: --force
          commit_message: "agents: avery tuesday [skip ci]"
          file_pattern: ".agents/outputs/*avery* .agents/memory/avery.md"

  casey:
    name: Casey — Upgrade Flow Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
