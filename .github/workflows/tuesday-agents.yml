# .github/workflows/tuesday-agents.yml
# PAUSED — alex: re-enable when Instagram or TikTok account reaches 500 followers
# PAUSED — taylor: re-enable when Twitter/Reddit account has posting history and 100+ followers
# PAUSED — sam: re-enable when the site has 50+ real users and at least 5 backlinks
# PAUSED — logan: re-enable when Mealzy has 200+ active users
# MANUAL — drew: run with node .github/scripts/run-agent.js drew
# MANUAL — casey: run with node .github/scripts/run-agent.js casey

name: Tuesday Agents

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # PAUSED — re-enable when Instagram or TikTok account reaches 500 followers
  alex:
    if: false
    name: Alex — Video Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js alex
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_WEBHOOK:  ${{ secrets.FACEBOOK_WEBHOOK }}
          INSTAGRAM_WEBHOOK: ${{ secrets.INSTAGRAM_WEBHOOK }}
          HCTI_USER_ID:      ${{ secrets.HCTI_USER_ID }}
          HCTI_API_KEY:      ${{ secrets.HCTI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: alex-tue, path: .agents/outputs/*alex* }

  avery:
    name: Avery — PageSpeed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js avery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: avery-tue, path: .agents/outputs/*avery* }

  # MANUAL — run with: node .github/scripts/run-agent.js casey
  casey:
    if: false
    name: Casey — Upgrade Flow Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js casey
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: casey-tue, path: .agents/outputs/*casey* }

  # MANUAL — run with: node .github/scripts/run-agent.js drew
  drew:
    if: false
    name: Drew — Specs + ICE Scores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js drew
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: drew-tue, path: .agents/outputs/*drew* }

  # PAUSED — re-enable when Mealzy has 200+ active users
  logan:
    if: false
    name: Logan — Outreach Drafts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js logan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: logan-tue, path: .agents/outputs/*logan* }

  # PAUSED — re-enable when the site has 50+ real users and at least 5 backlinks
  sam:
    if: false
    name: Sam — Publish SEO Page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js sam
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: sam-tue, path: .agents/outputs/*sam* }

  # PAUSED — re-enable when Twitter/Reddit account has posting history and 100+ followers
  taylor:
    if: false
    name: Taylor — Community Post + Outreach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js taylor
        env:
          ANTHROPIC_API_KEY:             ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTER_API_KEY:               ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:            ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:          ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET:   ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      - uses: actions/upload-artifact@v4
        with: { name: taylor-tue, path: .agents/outputs/*taylor* }

  culinary-critic:
    name: Culinary Critic — Description Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js culinary-critic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: culinary-critic-tue, path: .agents/outputs/*culinary-critic* }
