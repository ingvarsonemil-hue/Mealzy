name: Run Agent (Reusable)

on:
  workflow_call:
    inputs:
      agent_name:
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ vars.ANTHROPIC_API_KEY }}
          MAKE_FACEBOOK_WEBHOOK: ${{ vars.MAKE_FACEBOOK_WEBHOOK }}
          MAKE_INSTAGRAM_WEBHOOK: ${{ vars.MAKE_INSTAGRAM_WEBHOOK }}
          HCTI_USER_ID: ${{ vars.HCTI_USER_ID }}
          HCTI_API_KEY: ${{ vars.HCTI_API_KEY }}
        run: node .github/scripts/run-agent.js ${{ inputs.agent_name }}

      - name: Commit output and memory updates
        run: |
          git config user.name  "Mealzy Agents"
          git config user.email "agents@mealzy.org"
          git add .agents/outputs/ .agents/memory/
          git diff --cached --quiet || git commit -m "agent(${{ inputs.agent_name }}): weekly run $(date +%Y-%m-%d)"
          git push
