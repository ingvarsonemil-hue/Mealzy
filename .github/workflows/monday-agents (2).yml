          TWITTER_API_KEY:               ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:            ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:          ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET:   ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      - uses: actions/upload-artifact@v4
        with: { name: taylor, path: .agents/outputs/*taylor* }
  # ── WAVE 2: depends on wave 1 ────────────────────────────────────────────

  finlay:
    name: Finlay — Unit Economics
    runs-on: ubuntu-latest
    needs: [casey, avery]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js finlay
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: finlay, path: .agents/outputs/*finlay* }
  matteo:
    name: Matteo — i18n Signals
    runs-on: ubuntu-latest
    needs: [riley]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js matteo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: matteo, path: .agents/outputs/*matteo* }
  budget-guard:
    name: Budget Guard — Cost Tests
    runs-on: ubuntu-latest
    needs: [quinn]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js budget-guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: budget-guard, path: .agents/outputs/*budget-guard* }
  macro-specialist:
    name: Macro Specialist — Nutrition Tests
    runs-on: ubuntu-latest
    needs: [quinn]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js macro-specialist
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: macro-specialist, path: .agents/outputs/*macro-specialist* }
  culinary-critic:
    name: Culinary Critic — Flavour Review
    runs-on: ubuntu-latest
    needs: [quinn]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js culinary-critic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: culinary-critic, path: .agents/outputs/*culinary-critic* }
  grocery-optimizer:
    name: Grocery Optimizer — List Efficiency
    runs-on: ubuntu-latest
    needs: [quinn, budget-guard]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js grocery-optimizer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: grocery-optimizer, path: .agents/outputs/*grocery-optimizer* }
  # ── WAVE 3: reads wave 1+2 outputs ───────────────────────────────────────

  drew:
    name: Drew — PM Priorities
    runs-on: ubuntu-latest
    needs: [riley, casey, morgan, avery, charlie, robin]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js drew
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: drew, path: .agents/outputs/*drew* }
  # ── DIGEST ────────────────────────────────────────────────────────────────

  digest:
    name: Monday Digest
    runs-on: ubuntu-latest
    needs: [alex, blake, avery, morgan, riley, casey, charlie, harper, logan, maya, quinn, robin, taylor, finlay, matteo, budget-guard, macro-specialist, culinary-critic, grocery-optimizer, drew]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: .agents/outputs/, merge-multiple: true }
      - name: Commit all agent outputs
        run: |
          DATE=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add .agents/outputs/ .agents/memory/ || true
          git diff --cached --quiet || git commit -m "agents: monday outputs [skip ci]"
          git push origin main
      - name: Build digest
        run: |
          DATE=$(date +%Y-%m-%d)
          OUT=".agents/outputs/${DATE}-digest.md"
          echo "# Monday Digest — ${DATE}" > $OUT
          echo "" >> $OUT
          echo "| Agent | Status |" >> $OUT
          echo "|-------|--------|" >> $OUT
          for a in alex blake avery morgan riley casey charlie harper logan maya quinn robin taylor finlay matteo budget-guard macro-specialist culinary-critic grocery-optimizer drew; do
            F=".agents/outputs/${DATE}-${a}.md"
            [ -f "$F" ] && echo "| $a | ✅ |" >> $OUT || echo "| $a | ❌ |" >> $OUT
          done
          cat $OUT