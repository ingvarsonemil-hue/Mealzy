# .github/workflows/monday-agents.yml
# 17 agents run on Monday. Run order respects dependencies.

name: Monday Agents

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ── PRE-STEP: auto-update TEAM.md with live numbers ─────────────────────
  update-team:
    name: Update TEAM.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fetch live stats and update TEAM.md
        env:
          APP_URL: ${{ secrets.APP_URL }}
          PRO_TOKEN: ${{ secrets.PRO_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, os, subprocess, datetime

          app_url = os.environ.get('APP_URL', 'https://mealzy.org')
          token   = os.environ.get('PRO_TOKEN', '')
          date    = datetime.date.today().isoformat()

          def fetch(url):
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      return json.loads(r.read())
              except:
                  return {}

          a = fetch(f"{app_url}/api/analytics?token={token}")
          h = fetch(f"{app_url}/api/health")

          total_users = a.get("total_users", "unknown")
          pro_users   = a.get("pro_users", "unknown")
          signups     = a.get("this_month", {}).get("signups", "unknown")
          plans       = a.get("this_month", {}).get("plans_generated", "unknown")
          pro_act     = a.get("this_month", {}).get("pro_activations", "unknown")
          server      = h.get("status", "unknown")

          team_md = f"""# TEAM.md - Mealzy Agent Shared Context
          # Auto-updated every Monday. Last updated: {date}

          ## THIS WEEK - {date}

          ### Live numbers (auto-fetched from mealzy.org)
          - Total users: {total_users}
          - Pro subscribers: {pro_users}
          - Signups this month: {signups}
          - Plans generated this month: {plans}
          - Pro activations this month: {pro_act}
          - Server status: {server}

          ### Active this week
          - Update manually if there is a launch or anything special

          ### Blocked / don't work on
          - Update if anything should be skipped this week

          ---

          ## STANDING CONTEXT

          ### Product
          - Free tier: 3 plans/month, no credit card
          - Pro: $8/mo or $62/yr - unlimited plans, PDF export, AI coach Mia, advanced macros
          - Family: $16/mo or $130/yr - everything in Pro + up to 4 profiles
          - Stack: Node.js + Express, Turso SQLite, JWT cookies, Stripe, Render free tier
          - AI: claude-haiku-4-5-20251001 for meal gen and Mia coach

          ### Brand
          - Voice: warm, calm, direct. Friend who knows nutrition.
          - Never use: emojis, "level up", "game-changer", "transform", "clean eating", "guilt-free"
          - CTA always: Free at mealzy.org
          - Primary green: #3d8b5e

          ### Key URLs
          - App: https://mealzy.org
          - Upgrade: https://mealzy.org/upgrade.html
          - Dashboard: https://mealzy.org/dashboard.html

          ### Founder
          - Emil, 16yo solo founder, Sweden
          - Building in public

          ---

          ## CROSS-AGENT HANDOFFS
          (Agents leave notes here for each other)

          ---

          ## LAUNCH CALENDAR
          | Date | What | Owner | Status |
          |------|------|-------|--------|
          | TBD  | Family plan public launch | Drew + Taylor | planning |
          | TBD  | Product Hunt relaunch | Taylor | not started |

          ---

          ## RECENT WINS
          (Emil updates this)
          """

          import textwrap
          team_md = textwrap.dedent(team_md)

          with open(".agents/memory/TEAM.md", "w") as f:
              f.write(team_md)

          print(f"TEAM.md updated: {total_users} users, {pro_users} pro")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/memory/TEAM.md
          git diff --cached --quiet || git commit -m "chore: auto-update TEAM.md [skip ci]"
          git push origin main

  # ── WAVE 1: no dependencies ───────────────────────────────────────────────


  alex:
    needs: [update-team]
    name: Alex — Scripts + Carousel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js alex
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACEBOOK_WEBHOOK:  ${{ secrets.FACEBOOK_WEBHOOK }}
          INSTAGRAM_WEBHOOK: ${{ secrets.INSTAGRAM_WEBHOOK }}
          HCTI_USER_ID:      ${{ secrets.HCTI_USER_ID }}
          HCTI_API_KEY:      ${{ secrets.HCTI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: alex, path: .agents/outputs/*alex* }
  blake:
    needs: [update-team]
    name: Blake — Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js blake
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: blake, path: .agents/outputs/*blake* }
  avery:
    needs: [update-team]
    name: Avery — Infra Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js avery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: avery, path: .agents/outputs/*avery* }
  morgan:
    needs: [update-team]
    name: Morgan — Code Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node .github/scripts/run-agent.js morgan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
