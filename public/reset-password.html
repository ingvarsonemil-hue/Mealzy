<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Mealzy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#16a34a' } } } }</script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="text-2xl font-bold text-primary">Mealzy</a>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">

      <!-- REQUEST FORM (shown when no token in URL) -->
      <div id="request-view">
        <h1 class="text-xl font-bold mb-1">Reset your password</h1>
        <p class="text-gray-500 text-sm mb-6">Enter your email and we will generate a reset link.</p>

        <form onsubmit="requestReset(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="reset-email" type="email" placeholder="you@example.com" required
              class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
          </div>
          <div id="request-error" class="hidden bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3"></div>
          <div id="request-success" class="hidden bg-green-50 text-green-800 text-sm rounded-xl px-4 py-4 space-y-2"></div>
          <button type="submit" id="request-btn"
            class="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-green-700 transition-colors disabled:opacity-60">
            Send reset link
          </button>
        </form>
      </div>

      <!-- NEW PASSWORD FORM (shown when token present in URL) -->
      <div id="reset-view" class="hidden">
        <h1 class="text-xl font-bold mb-1">Set a new password</h1>
        <p class="text-gray-500 text-sm mb-6">Choose a password with at least 6 characters.</p>

        <form onsubmit="submitReset(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">New password</label>
            <input id="new-password" type="password" placeholder="At least 6 characters" required autocomplete="new-password"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
            <input id="confirm-password" type="password" placeholder="Repeat your password" required
              class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
          </div>
          <div id="reset-error" class="hidden bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3"></div>
          <div id="reset-success" class="hidden bg-green-50 text-green-800 text-sm rounded-xl px-4 py-3"></div>
          <button type="submit" id="reset-btn"
            class="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-green-700 transition-colors disabled:opacity-60">
            Update password
          </button>
        </form>
      </div>

    </div>

    <p class="text-center mt-6">
      <a href="/login" class="text-sm text-primary hover:underline">Back to log in</a>
    </p>
  </div>

  <script>
    // Detect token in URL → show the correct form
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (token) {
      document.getElementById('request-view').classList.add('hidden');
      document.getElementById('reset-view').classList.remove('hidden');
    }

    function setLoading(btnId, loading, defaultText) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait...' : defaultText;
    }

    async function requestReset(e) {
      e.preventDefault();
      const errEl = document.getElementById('request-error');
      const successEl = document.getElementById('request-success');
      errEl.classList.add('hidden');
      successEl.classList.add('hidden');
      setLoading('request-btn', true, 'Send reset link');

      try {
        const res = await fetch('/api/reset-password-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('reset-email').value })
        });
        const data = await res.json();

        if (data.success) {
          let html = `<p>${data.message}</p>`;
          // Show the link directly since email is not yet wired up
          if (data.resetLink) {
            html += `<p class="mt-2 font-medium">Your reset link (use this until email is configured):</p>
                     <a href="${data.resetLink}" class="break-all text-primary underline text-xs">${data.resetLink}</a>`;
          }
          successEl.innerHTML = html;
          successEl.classList.remove('hidden');
        } else {
          errEl.textContent = data.error || 'Something went wrong. Please try again.';
          errEl.classList.remove('hidden');
        }
      } catch {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.remove('hidden');
      } finally {
        setLoading('request-btn', false, 'Send reset link');
      }
    }

    async function submitReset(e) {
      e.preventDefault();
      const errEl = document.getElementById('reset-error');
      const successEl = document.getElementById('reset-success');
      errEl.classList.add('hidden');
      successEl.classList.add('hidden');

      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.remove('hidden');
        return;
      }

      setLoading('reset-btn', true, 'Update password');

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (data.success) {
          successEl.textContent = data.message + ' Redirecting to log in...';
          successEl.classList.remove('hidden');
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          errEl.textContent = data.error || 'Something went wrong. Please try again.';
          errEl.classList.remove('hidden');
        }
      } catch {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.remove('hidden');
      } finally {
        setLoading('reset-btn', false, 'Update password');
      }
    }
  </script>
</body>
</html>
