  <path d="M 489,89 Q 489,105 501,106 Q 513,105 513,89" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="493" y1="106" x2="509" y2="106" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 501,76 L 503.2,81.8 L 509,84 L 503.2,86.2 L 501,92 L 498.8,86.2 L 493,84 L 498.8,81.8 Z" fill="white"/>
