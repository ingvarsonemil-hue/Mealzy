<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0faf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f5ec;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9fffe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00000018"/>
    </filter>
    <filter id="cardshadow" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#00000012"/>
    </filter>
    <clipPath id="appClip">
      <rect x="180" y="60" width="840" height="680" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="80" cy="120" r="140" fill="#3d8b5e" opacity="0.06"/>
  <circle cx="1140" cy="700" r="180" fill="#3d8b5e" opacity="0.07"/>
  <circle cx="1080" cy="100" r="80" fill="#3d8b5e" opacity="0.05"/>

  <!-- App window -->
  <rect x="180" y="60" width="840" height="680" rx="24" fill="white" filter="url(#shadow)"/>

  <!-- App top bar -->
  <rect x="180" y="60" width="840" height="64" rx="24" fill="#3d8b5e"/>
  <rect x="180" y="100" width="840" height="24" fill="#3d8b5e"/>

