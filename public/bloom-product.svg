  <text x="890" y="675" font-family="-apple-system, sans-serif" font-size="11" fill="white" opacity="0.8" text-anchor="middle">Your streak</text>
  <text x="890" y="696" font-family="Georgia, serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">🔥 7 days</text>

