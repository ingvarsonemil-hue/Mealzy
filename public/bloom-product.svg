  <text x="482" y="384" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#1a2e1a">Pasta Primavera</text>
  <text x="482" y="402" font-family="-apple-system, sans-serif" font-size="11" fill="#6b7280">Dinner · 520 kcal</text>
