  <rect x="462" y="450" width="210" height="160" rx="14" fill="white" filter="url(#cardshadow)"/>
  <rect x="462" y="450" width="210" height="90" rx="14" fill="#dcfce7"/>
  <rect x="462" y="510" width="210" height="30" fill="#dcfce7"/>
  <text x="567" y="505" font-family="sans-serif" font-size="36" text-anchor="middle">🍜</text>
  <text x="482" y="564" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#1a2e1a">Veggie Ramen</text>
  <text x="482" y="582" font-family="-apple-system, sans-serif" font-size="11" fill="#6b7280">Dinner · 410 kcal</text>
  <rect x="482" y="592" width="60" height="8" rx="4" fill="#d4edda"/>
  <text x="483" y="600" font-family="-apple-system, sans-serif" font-size="9" fill="#3d8b5e">Cozy</text>

  <!-- Card 6 -->
  <rect x="692" y="450" width="210" height="160" rx="14" fill="white" filter="url(#cardshadow)"/>
  <rect x="692" y="450" width="210" height="90" rx="14" fill="#fff7ed"/>
  <rect x="692" y="510" width="210" height="30" fill="#fff7ed"/>
  <text x="797" y="505" font-family="sans-serif" font-size="36" text-anchor="middle">🌮</text>
  <text x="712" y="564" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#1a2e1a">Chicken Tacos</text>
  <text x="712" y="582" font-family="-apple-system, sans-serif" font-size="11" fill="#6b7280">Dinner · 490 kcal</text>
  <rect x="712" y="592" width="60" height="8" rx="4" fill="#d4edda"/>
  <text x="713" y="600" font-family="-apple-system, sans-serif" font-size="9" fill="#3d8b5e">Family</text>

