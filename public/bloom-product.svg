  <text x="280" y="694" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#3d8b5e">$47.50</text>

  <line x1="430" y1="655" x2="430" y2="715" stroke="#e5e7eb" stroke-width="1"/>

  <text x="460" y="672" font-family="-apple-system, sans-serif" font-size="12" fill="#6b7280">Calories / day</text>
  <text x="460" y="694" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1a2e1a">1,840</text>

  <line x1="600" y1="655" x2="600" y2="715" stroke="#e5e7eb" stroke-width="1"/>

  <text x="630" y="672" font-family="-apple-system, sans-serif" font-size="12" fill="#6b7280">Meals planned</text>
  <text x="630" y="694" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1a2e1a">14</text>

  <!-- XP badge -->
