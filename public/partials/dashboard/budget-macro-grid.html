<!-- Budget + Macro overview, side by side. Budget half uses placeholder
     numbers (marked "Preview" — no real spend-tracking exists yet) so it
     reads as a coming feature, not a false claim about the user's spending. -->
<div class="card dash-anim budget-macro-grid" style="margin-bottom:1.5rem;">
  <div class="budget-macro-col budget-macro-col-spend">
    <div class="card-title" style="font-family:var(--font-display);font-style:italic;">Budget</div>
    <div class="budget-macro-spend-row">
      <div>
        <div class="budget-macro-label">Daily Spend <span class="badge budget-macro-badge">Preview</span></div>
        <div class="budget-macro-value">$12.40</div>
      </div>
      <div>
        <div class="budget-macro-label">Remaining This Week</div>
        <div class="budget-macro-value budget-macro-value-remaining">$37.60</div>
      </div>
    </div>
  </div>
  <div class="budget-macro-col budget-macro-col-macro">
    <div class="card-header" style="padding:0;border:none;">
      <div class="card-title" data-i18n="macro_overview" style="font-family:var(--font-display);font-style:italic;">Macro Overview</div>
      <span class="text-muted text-sm" id="macroDate">Today</span>
    </div>
    <div class="rings-grid-v2">
      <div class="ring-card-v2">
        <div class="ring-label-v2" data-i18n="stat_protein">Protein</div>
        <svg width="100" height="100" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="40" fill="none" class="macro-ring-track" stroke="var(--clr-border)" stroke-width="10"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke="var(--clr-warning)" stroke-width="10"
            stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round"
            transform="rotate(-90 50 50)" id="ringProtein"/>
          <text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="var(--clr-foreground)" id="ringProteinVal">0g</text>
          <text x="50" y="60" text-anchor="middle" font-size="9" fill="var(--clr-muted-fg)" id="ringProteinPct">0%</text>
        </svg>
        <div class="ring-target-v2" id="ringProteinTarget">Goal: 0g</div>
      </div>
      <div class="ring-card-v2">
        <div class="ring-label-v2" data-i18n="macro_carbs">Carbs</div>
        <svg width="100" height="100" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="40" fill="none" class="macro-ring-track" stroke="var(--clr-border)" stroke-width="10"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke="var(--clr-info)" stroke-width="10"
            stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round"
            transform="rotate(-90 50 50)" id="ringCarbs"/>
          <text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="var(--clr-foreground)" id="ringCarbsVal">0g</text>
          <text x="50" y="60" text-anchor="middle" font-size="9" fill="var(--clr-muted-fg)" id="ringCarbsPct">0%</text>
        </svg>
        <div class="ring-target-v2" id="ringCarbsTarget">Goal: 0g</div>
      </div>
      <div class="ring-card-v2">
        <div class="ring-label-v2" data-i18n="macro_fat">Fat</div>
        <svg width="100" height="100" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="40" fill="none" class="macro-ring-track" stroke="var(--clr-border)" stroke-width="10"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke="var(--clr-accent)" stroke-width="10"
            stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round"
            transform="rotate(-90 50 50)" id="ringFat"/>
          <text x="50" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="var(--clr-foreground)" id="ringFatVal">0g</text>
          <text x="50" y="60" text-anchor="middle" font-size="9" fill="var(--clr-muted-fg)" id="ringFatPct">0%</text>
        </svg>
        <div class="ring-target-v2" id="ringFatTarget">Goal: 0g</div>
      </div>
    </div>
    <div class="macro-empty" id="macroEmptyState" style="display:none;">
      <p>Your daily target: <strong id="macroEmptyTargets">0g protein · 0g carbs · 0g fat</strong></p>
      <p class="hint">Mark a meal as done to see your progress.</p>
    </div>
  </div>
</div>
