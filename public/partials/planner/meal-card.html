<div class="meal-card__DONE_CARD_CLASS__" data-meal-id="__MEAL_ID__">
  <div class="meal-card__header">
    <span class="meal-card__type">__TYPE__</span>
    <div class="meal-card__actions">
      <button class="meal-card__action__FAV_ACTIVE__" data-action="favorite" type="button" aria-label="Favorite meal" aria-pressed="__FAV_PRESSED__">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
      <button class="meal-card__action__DONE_ACTIVE__" data-action="done" type="button" aria-label="Mark done" aria-pressed="__DONE_PRESSED__">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <button class="meal-card__action" data-action="swap" type="button">Swap</button>
      <button class="meal-card__action" data-action="delete" type="button">Delete</button>
    </div>
  </div>
  <div class="meal-card__body" data-action="toggle-details">
    <h3 class="meal-card__title">__TITLE__</h3>
    <p class="meal-card__desc">__DESC__</p>
    <div class="meal-card__metrics">
      <div class="metric metric--cost">
        <span class="metric__label">Cost</span>
        <span class="metric__value">__COST__</span>
      </div>
      <div class="metric">
        <span class="metric__label">Cals</span>
        <span class="metric__value">__CALORIES__</span>
      </div>
      <div class="metric">
        <span class="metric__label">Protein</span>
        <span class="metric__value">__PROTEIN__g</span>
      </div>
    </div>
  </div>
  <div class="meal-card__details" hidden>
    <div class="meal-card__section">
      <h4>Ingredients</h4>
      <ul class="meal-card__list">__INGREDIENTS__</ul>
    </div>
    <div class="meal-card__section">
      <h4>Instructions</h4>
      <p>__INSTRUCTIONS__</p>
    </div>
  </div>
</div>
