  <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:0.75rem;">
    <div>
      <h1 style="font-family:var(--font-display);font-style:italic;font-weight:700;font-size:1.8rem;letter-spacing:-0.03em;">Meal Planner</h1>
      <p class="text-muted" style="margin-top:0.2rem;font-size:0.9rem;">Plan and manage your meals day by day</p>
    </div>
    <a class="btn btn-outline btn-sm" href="grocery-list.html" style="display:flex;align-items:center;gap:0.4rem;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Shop Grocery List
    </a>
  </div>

  <div class="planner-header__row">
    <div class="planner-header__actions">
      <div class="view-toggle" role="tablist" aria-label="Meal plan view">
        <button class="view-toggle-btn active" id="dayViewBtn" role="tab" aria-selected="true" aria-controls="mealsContainer" onclick="setView('day')">Day View</button>
        <button class="view-toggle-btn" id="weekViewBtn" role="tab" aria-selected="false" aria-controls="weekViewContainer" onclick="setView('week')">Week View</button>
      </div>
      <button class="btn btn-outline btn-sm" onclick="openCustomMealModal(null, 'lunch')" style="display:flex;align-items:center;gap:0.4rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add custom meal
      </button>
    </div>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;color:var(--clr-muted-fg);" for="householdSizeSelect">
        Servings for
        <select class="form-select" id="householdSizeSelect" style="width:auto;padding:0.3rem 1.75rem 0.3rem 0.6rem;font-size:0.82rem;" onchange="setHouseholdSize(this.value)">
          <option value="1">1 person</option>
          <option value="2">2 people</option>
          <option value="3">3 people</option>
          <option value="4">4 people</option>
          <option value="5">5 people</option>
          <option value="6">6 people</option>
          <option value="7">7 people</option>
          <option value="8">8 people</option>
        </select>
      </label>
      <button class="btn btn-outline btn-sm" onclick="window.print()" title="Print meal plan" style="display:flex;align-items:center;gap:0.4rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print
      </button>
    </div>
  </div>

  <div class="date-navigator" id="dateNavigator">
    <button class="btn btn-outline btn-sm" onclick="changeDate(-1)" style="min-height:44px;" aria-label="Previous week">&#8592; Prev</button>
    <div class="date-display" id="dateDisplay">Today</div>
    <button class="btn btn-outline btn-sm" onclick="changeDate(1)" style="min-height:44px;" aria-label="Next week">Next &#8594;</button>
    <button class="btn btn-primary" id="generateBtn" aria-label="Generate AI meal plan for this day" onclick="generateMealPlan()" style="display:flex;align-items:center;gap:0.4rem;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Generate AI Plan
    </button>
    <button class="btn btn-outline btn-sm" onclick="regenerateMealPlan()" aria-label="Regenerate meal plan with different meals" style="min-height:44px;display:flex;align-items:center;gap:0.4rem;" title="Generate a completely different plan">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>
