<div class="modal-overlay" id="loadingOverlay">
  <div class="modal" style="max-width:320px;text-align:center;padding:2.5rem;">
    <div class="spinner" style="margin-bottom:1.25rem;"></div>
    <h3 style="margin-bottom:0.5rem;">Building your plan...</h3>
    <p class="text-muted text-sm" id="loadingMsg" style="min-height:1.5em;transition:opacity 0.3s;">Calculating your macros...</p>
    <div style="margin-top:1rem;background:var(--clr-muted-bg);border-radius:0.5rem;height:4px;overflow:hidden;">
      <div id="loadingBar" style="height:100%;background:var(--clr-primary);border-radius:0.5rem;width:0%;transition:width 0.8s ease;"></div>
    </div>
  </div>
</div>
