<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/theme-init.js"></script>
<!-- Cookie consent gate (must load before analytics) -->
<script src="/js/consent.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mealzy — Get Started</title>
<meta name="description" content="Set up your Mealzy profile — tell us your goals, dietary preferences, and budget to get your first personalized meal plan.">
<meta property="og:title" content="Get Started — Mealzy">
<meta property="og:description" content="Set up your Mealzy profile — tell us your goals, dietary preferences, and budget to get your first personalized meal plan.">
<meta property="og:image" content="https://mealzy.org/images/og-image.jpg">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/landing.css">
<link rel="stylesheet" href="/css/funnel.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1a3d2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mealzy">
<style>
  /* Onboarding wizard — page-specific pieces on top of the card-page layer */
  .page-card.ob { max-width: 580px; }
  .ob-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .ob-logo { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 1.35rem; color: var(--color-foreground); text-decoration: none; }
  .ob-stepper { display: flex; align-items: center; }
  .ob-step {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 0.78rem; font-weight: 700;
    background: transparent; color: var(--color-muted-fg);
    border: 2px solid var(--color-border);
    transition: background var(--duration-fast), color var(--duration-fast), border-color var(--duration-fast);
  }
  .ob-step.active { background: var(--color-green); color: var(--clr-on-primary); border-color: var(--color-green); box-shadow: 0 0 0 3px rgba(var(--color-green-rgb), 0.25); }
  .ob-step.done { background: var(--color-green-muted); color: var(--color-forest); border-color: var(--color-green-muted); }
  .ob-step-line { width: 24px; height: 2px; background: var(--color-border); transition: background var(--duration-fast); }
  .ob-step-line.done { background: var(--color-green); }
  .ob-step-title { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 0.4rem; }
  .ob-step-sub { color: var(--color-muted-fg); font-size: 0.92rem; line-height: 1.6; margin-bottom: 1.5rem; }

  .goal-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem; }
  @media (max-width: 440px) { .goal-grid { grid-template-columns: minmax(0, 1fr); } }
  .goal-card {
    position: relative; display: flex; align-items: center;
    height: 60px; padding: 0 40px 0 18px; width: 100%;
    background: var(--clr-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md);
    cursor: pointer; transition: border-color var(--duration-fast), background var(--duration-fast);
  }
  .goal-card:hover { border-color: var(--color-green); }
  .goal-card.selected { border: 2px solid var(--color-green); background: var(--color-parchment); }
  .goal-label { font-weight: 600; font-size: 0.98rem; }
  .goal-card.selected .goal-label { font-weight: 700; }
  .goal-check {
    position: absolute; top: 50%; right: 14px; transform: translateY(-50%) scale(0.5);
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-green); color: var(--clr-on-primary);
    opacity: 0; transition: opacity var(--duration-fast), transform var(--duration-fast);
  }
  .goal-card.selected .goal-check { opacity: 1; transform: translateY(-50%) scale(1); }
  .goal-radio-input { opacity: 0; position: absolute; width: 1px; height: 1px; pointer-events: none; }
  .goal-card:focus-within { outline: 2px solid var(--color-green); outline-offset: 2px; }

  .chips-group { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .chip {
    display: inline-flex; align-items: center; padding: 0.4rem 0.9rem;
    border: 1px solid var(--color-border); border-radius: var(--radius-full);
    font-size: 0.82rem; font-weight: 500; cursor: pointer;
    background: var(--clr-surface); color: var(--color-foreground);
    transition: border-color var(--duration-fast), background var(--duration-fast), color var(--duration-fast);
  }
  .chip:hover { border-color: var(--color-green); color: var(--color-green); }
  .chip.active { background: var(--color-green); border-color: var(--color-green); color: var(--clr-on-primary); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
  @media (max-width: 440px) { .form-row { grid-template-columns: 1fr; } }
  .btn-skip { background: none; border: none; color: var(--color-muted-fg); font-size: 0.85rem; cursor: pointer; text-decoration: underline; padding: 0.25rem; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .page-card.ob { animation: rise 0.45s var(--ease-out) both; }
  }
</style>
</head>
<body class="card-page">
<a href="#main" class="skip-link">Skip to main content</a>

<main id="main" class="page-card ob">
  <div class="ob-top">
    <a href="/" class="ob-logo">Mealzy</a>
    <nav aria-label="Onboarding progress">
      <div class="ob-stepper" role="progressbar" aria-label="Onboarding step 1 of 2" aria-valuenow="1" aria-valuemin="1" aria-valuemax="2" id="stepProgress">
        <div class="ob-step active" id="obStep1" aria-label="Step 1 of 2">1</div>
        <div class="ob-step-line" id="obLine1"></div>
        <div class="ob-step" id="obStep2" aria-label="Step 2 of 2">2</div>
      </div>
    </nav>
  </div>

  <!-- STEP 1: Name + Goal -->
  <div class="step-content" id="step1">
    <h1 class="ob-step-title">Let's personalise your plan</h1>
    <div class="ob-step-sub">Two quick questions and we'll generate your first meal plan — automatically.</div>
    <div class="form-group">
      <label class="form-label" for="inputName">Your first name</label>
      <input type="text" class="form-input" id="inputName" placeholder="e.g. Alex" autocomplete="given-name">
    </div>
    <div class="form-group" style="margin-top:1.25rem;">
      <fieldset style="border:none;padding:0;margin:0;">
        <legend class="form-label" style="float:none;display:block;margin-bottom:0.5rem;">What's your main goal?</legend>
        <div class="goal-grid" role="radiogroup" aria-label="Select your goal">
          <label class="goal-card" data-goal="build_muscle" tabindex="0">
            <input type="radio" name="goal" value="build_muscle" class="goal-radio-input" role="radio" aria-checked="false" onchange="selectGoal(this.closest('label'))">
            <span class="goal-label">Build Muscle</span>
            <span class="goal-check" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
          <label class="goal-card" data-goal="lose_weight" tabindex="0">
            <input type="radio" name="goal" value="lose_weight" class="goal-radio-input" role="radio" aria-checked="false" onchange="selectGoal(this.closest('label'))">
            <span class="goal-label">Lose Weight</span>
            <span class="goal-check" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
          <label class="goal-card" data-goal="maintain_weight" tabindex="0">
            <input type="radio" name="goal" value="maintain_weight" class="goal-radio-input" role="radio" aria-checked="false" onchange="selectGoal(this.closest('label'))">
            <span class="goal-label">Maintain Weight</span>
            <span class="goal-check" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
          <label class="goal-card" data-goal="eat_healthier" tabindex="0">
            <input type="radio" name="goal" value="eat_healthier" class="goal-radio-input" role="radio" aria-checked="false" onchange="selectGoal(this.closest('label'))">
            <span class="goal-label">Eat Healthier</span>
            <span class="goal-check" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
          <label class="goal-card" data-goal="gain_weight" tabindex="0">
            <input type="radio" name="goal" value="gain_weight" class="goal-radio-input" role="radio" aria-checked="false" onchange="selectGoal(this.closest('label'))">
            <span class="goal-label">Gain Weight</span>
            <span class="goal-check" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
          <label class="goal-card" data-goal="improve_energy" tabindex="0">
            <input type="radio" name="goal" value="improve_energy" class="goal-radio-input" role="radio" aria-checked="false" onchange="selectGoal(this.closest('label'))">
            <span class="goal-label">Improve Energy</span>
            <span class="goal-check" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
        </div>
      </fieldset>
    </div>
  </div>

  <!-- STEP 2: Budget + Dietary -->
  <div class="step-content hidden" id="step2">
    <div class="ob-step-title">Budget &amp; dietary needs</div>
    <div class="ob-step-sub">We'll keep your meals affordable and safe to eat.</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="inputBudget">Weekly Food Budget</label>
        <input type="number" class="form-input" id="inputBudget" placeholder="100" min="20" max="1000" value="100">
      </div>
      <div class="form-group">
        <label class="form-label" for="selectCurrency">Currency</label>
        <select class="form-select" id="selectCurrency">
          <option value="USD">$ USD</option><option value="EUR">&euro; EUR</option><option value="GBP">&pound; GBP</option>
          <option value="SEK">kr SEK</option><option value="NOK">kr NOK</option><option value="DKK">kr DKK</option>
          <option value="CAD">$ CAD</option><option value="AUD">$ AUD</option><option value="NZD">$ NZD</option>
          <option value="CHF">Fr CHF</option><option value="JPY">&yen; JPY</option><option value="CNY">&yen; CNY</option>
          <option value="KRW">&#8361; KRW</option><option value="INR">&#8377; INR</option><option value="BRL">R$ BRL</option>
          <option value="MXN">$ MXN</option><option value="ARS">$ ARS</option><option value="ZAR">R ZAR</option>
          <option value="AED">&#1583;.&#1573; AED</option><option value="SAR">&#65020; SAR</option><option value="SGD">$ SGD</option>
          <option value="HKD">$ HKD</option><option value="PLN">z&#322; PLN</option><option value="CZK">K&#269; CZK</option>
          <option value="HUF">Ft HUF</option><option value="TRY">&#8378; TRY</option><option value="THB">&#3647; THB</option>
          <option value="MYR">RM MYR</option><option value="IDR">Rp IDR</option><option value="PHP">&#8369; PHP</option>
        </select>
      </div>
    </div>
    <div class="form-group" style="margin-top:0.75rem;">
      <label class="form-label">Any dietary restrictions? <span style="font-weight:400;color:var(--color-muted-fg);">(optional)</span></label>
      <div class="chips-group" id="dietChips">
        <button class="chip" data-pref="vegetarian" onclick="toggleChip(this)" aria-pressed="false">Vegetarian</button>
        <button class="chip" data-pref="vegan" onclick="toggleChip(this)" aria-pressed="false">Vegan</button>
        <button class="chip" data-pref="keto" onclick="toggleChip(this)" aria-pressed="false">Keto</button>
        <button class="chip" data-pref="paleo" onclick="toggleChip(this)" aria-pressed="false">Paleo</button>
        <button class="chip" data-pref="mediterranean" onclick="toggleChip(this)" aria-pressed="false">Mediterranean</button>
        <button class="chip" data-pref="halal" onclick="toggleChip(this)" aria-pressed="false">Halal</button>
        <button class="chip" data-pref="kosher" onclick="toggleChip(this)" aria-pressed="false">Kosher</button>
        <button class="chip" data-pref="gluten_free" onclick="toggleChip(this)" aria-pressed="false">Gluten-Free</button>
        <button class="chip" data-pref="dairy_free" onclick="toggleChip(this)" aria-pressed="false">Dairy-Free</button>
        <button class="chip" data-pref="nut_free" onclick="toggleChip(this)" aria-pressed="false">Nut &amp; Peanut-Free</button>
        <button class="chip" data-pref="no_pork" onclick="toggleChip(this)" aria-pressed="false">No Pork</button>
        <button class="chip" data-pref="fish_free" onclick="toggleChip(this)" aria-pressed="false">Fish-Free</button>
      </div>
    </div>
  </div>

  <div id="stepError" class="auth-msg" role="alert" aria-live="assertive" style="margin-top:0.75rem;"></div>

  <div style="margin-top:1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;">
    <button class="btn btn-outline" id="btnBack" onclick="prevStep()" style="visibility:hidden;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem;">
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <button id="btnSkip" class="btn-skip" onclick="skipStep()">Skip</button>
        <button class="btn btn-primary btn-lg" id="btnNext" onclick="nextStep()">
          Continue
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <p id="skipNote" style="font-size:0.75rem;color:var(--color-muted-fg);margin:0;text-align:right;">We'll use estimated values — you can update these in Settings.</p>
    </div>
  </div>
</main>

<script>
  // Auth guard
  (async function checkAuth() {
    try {
      const res = await fetch('/api/auth/me');
      if (res.ok) {
        const data = await res.json();
        localStorage.setItem('mealzy_user', JSON.stringify({ name: data.name, email: data.email }));
        if (data.pro) localStorage.setItem('mealzy_pro', 'true');
        // Pre-fill first name only — data.name holds the full name
        if (data.name) {
          const firstName = data.name.trim().split(/\s+/)[0];
          const nameInput = document.getElementById('inputName');
          if (nameInput && !nameInput.value) nameInput.value = firstName;
          userData.name = firstName;
        }
      } else {
        localStorage.removeItem('mealzy_user');
        window.location.href = 'login.html?signup=1';
      }
    } catch(e) {
      if (!localStorage.getItem('mealzy_user')) window.location.href = 'login.html?signup=1';
    }
  })();

  function showStepError(msg) {
    const el = document.getElementById('stepError');
    el.textContent = msg;
    el.classList.add('show');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function hideStepError() {
    document.getElementById('stepError').classList.remove('show');
  }

  let currentStep = 1;
  const totalSteps = 2;

  const userData = {
    name: '',
    goal: '',
    dietaryPrefs: [],
    allergies: [],
    budget: 100,
    currency: 'USD',
    // Sensible defaults — user can refine in Settings
    age: 28,
    gender: 'other',
    weight: 70,
    height: 170,
    activityLevel: 'moderately_active',
    activityMultiplier: 1.55,
    cookingSkill: 'intermediate',
    cookingTimeMinutes: 30,
    preferred_cuisine: '',
    language: 'en',
    dailyCalories: 2000,
    macros: { protein: 150, carbs: 200, fat: 67 }
  };

  function showStep(step) {
    document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
    document.getElementById('step' + step).classList.remove('hidden');
    document.getElementById('btnBack').style.visibility = step > 1 ? 'visible' : 'hidden';
    document.getElementById('btnSkip').style.display = step < totalSteps ? 'inline-block' : 'none';
    const skipNote = document.getElementById('skipNote');
    if (skipNote) skipNote.style.display = step < totalSteps ? 'block' : 'none';
    const nextBtn = document.getElementById('btnNext');
    nextBtn.innerHTML = step === totalSteps
      ? `Create My Plan`
      : `Continue <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>`;
    // Update stepper visuals
    for (let s = 1; s <= totalSteps; s++) {
      const el = document.getElementById('obStep' + s);
      if (!el) continue;
      el.classList.remove('active', 'done');
      el.removeAttribute('aria-current');
      if (s < step) { el.classList.add('done'); el.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>`; }
      else if (s === step) { el.classList.add('active'); el.textContent = s; el.setAttribute('aria-current', 'step'); }
      else { el.textContent = s; }
    }
    for (let l = 1; l < totalSteps; l++) {
      const line = document.getElementById('obLine' + l);
      if (line) line.classList.toggle('done', l < step);
    }
    document.getElementById('stepProgress').setAttribute('aria-valuenow', currentStep);
    document.getElementById('stepProgress').setAttribute('aria-label', 'Onboarding step ' + currentStep + ' of ' + totalSteps);
  }

  function nextStep() {
    if (!validateStep(currentStep)) return;
    if (currentStep < totalSteps) {
      if (currentStep === 1 && window.amplitude) amplitude.track('Onboarding Step 1 Completed', { goal: userData.goal });
      currentStep++;
      showStep(currentStep);
    } else {
      finishOnboarding();
    }
  }

  function prevStep() {
    hideStepError();
    if (currentStep > 1) { currentStep--; showStep(currentStep); }
  }

  function skipStep() {
    hideStepError();
    if (currentStep === 1) {
      const nameInput = document.getElementById('inputName');
      if (!nameInput.value.trim()) { nameInput.focus(); return; }
    }
    if (currentStep < totalSteps) { currentStep++; showStep(currentStep); }
  }

  function validateStep(step) {
    hideStepError();
    if (step === 1) {
      userData.name = document.getElementById('inputName').value.trim();
      if (!userData.name) { showStepError('Please enter your name.'); return false; }
      if (!userData.goal) { showStepError('Please pick a goal to continue.'); return false; }
    }
    if (step === 2) {
      userData.budget = parseFloat(document.getElementById('inputBudget').value) || 100;
      userData.currency = document.getElementById('selectCurrency').value;
      updateChipsData();
    }
    return true;
  }

  function selectGoal(el) {
    document.querySelectorAll('.goal-card').forEach(c => {
      c.classList.remove('selected');
      const inp = c.querySelector('input[type="radio"]');
      if (inp) inp.setAttribute('aria-checked', 'false');
    });
    el.classList.add('selected');
    const inp = el.querySelector('input[type="radio"]');
    if (inp) inp.setAttribute('aria-checked', 'true');
    userData.goal = el.dataset.goal;
    hideStepError();
  }

  document.querySelectorAll('.goal-card').forEach(card => {
    card.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        selectGoal(card);
        card.querySelector('input[type="radio"]').checked = true;
      }
    });
  });

  function toggleChip(el) {
    el.classList.toggle('active');
    el.setAttribute('aria-pressed', el.classList.contains('active') ? 'true' : 'false');
    updateChipsData();
  }

  function updateChipsData() {
    const selected = Array.from(document.querySelectorAll('#dietChips .chip.active')).map(c => c.dataset.pref);
    // Separate dietary prefs from allergies for backward compat
    const allergyPrefs = ['gluten_free','dairy_free','nut_free','fish_free'];
    userData.dietaryPrefs = selected.filter(p => !allergyPrefs.includes(p));
    userData.allergies = selected.filter(p => allergyPrefs.includes(p)).map(p => p.replace('_free', '').replace('no_', ''));
    // Also merge "no_pork" etc
    if (selected.includes('no_pork')) userData.allergies.push('pork');
  }

  function calcNutrition() {
    // Sensible defaults based on goal
    const caloriesByGoal = {
      lose_weight: 1700,
      build_muscle: 2500,
      gain_weight: 2800,
      maintain_weight: 2000,
      eat_healthier: 2000,
      improve_energy: 2000
    };
    const calories = caloriesByGoal[userData.goal] || 2000;
    const protein  = Math.round(calories * 0.30 / 4);
    const carbs    = Math.round(calories * 0.40 / 4);
    const fat      = Math.round(calories * 0.30 / 9);
    userData.dailyCalories = calories;
    userData.macros = { protein, carbs, fat };
    return { calories, protein, carbs, fat };
  }

  async function finishOnboarding() {
    const btn = document.getElementById('btnNext');
    btn.disabled = true;
    btn.textContent = 'Setting up...';

    calcNutrition();
    updateChipsData();

    const profile = {
      ...userData,
      createdAt: new Date().toISOString(),
      streak: 1,
      weekStreak: 0,
      xp: 0,
      level: 1,
      lastActiveDate: new Date().toISOString().split('T')[0]
    };

    localStorage.setItem('mealzy_profile', JSON.stringify(profile));
    localStorage.setItem('mealzy_is_new_user', '1');

    // Save profile to server
    try {
      await fetch('/api/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ profile })
      });
    } catch(e) { /* localStorage fallback */ }

    // Award onboarding XP on the server
    try {
      await fetch('/api/xp/award', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'onboarding' })
      });
    } catch(e) {}

    if (window.amplitude) amplitude.track('Onboarding Step 2 Completed', { goal: userData.goal, budget: userData.budget });

    // Redirect to dashboard with autoGenerate flag
    window.location.href = 'dashboard.html?autoGenerate=1';
  }
</script>
</body>
</html>
