<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in or Sign up | Mealzy</title>
  <meta name="description" content="Log in to your Mealzy account or create a free account to start generating AI meal plans.">
  <meta property="og:title" content="Log in or Sign up | Mealzy">
  <meta property="og:description" content="Create a free Mealzy account and get 3 AI meal plans every month.">
  <meta property="og:image" content="https://meal-plan-app-2nn3.onrender.com/og-image.png">
  <meta property="og:url" content="https://meal-plan-app-2nn3.onrender.com/login">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#16a34a' } } } }</script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="/" class="text-2xl font-bold text-primary">Mealzy</a>
      <p class="text-gray-500 text-sm mt-1">AI meal plans in 30 seconds</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <!-- Tabs -->
      <div class="flex rounded-xl bg-gray-100 p-1 mb-8">
        <button id="tab-login" onclick="switchTab('login')"
          class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all bg-white shadow-sm text-gray-900">
          Log in
        </button>
        <button id="tab-register" onclick="switchTab('register')"
          class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all text-gray-500 hover:text-gray-700">
          Sign up
        </button>
      </div>

      <!-- Login form -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" required autocomplete="email"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="login-password" type="password" placeholder="Your password" required autocomplete="current-password"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
        </div>
        <div class="text-right">
          <a href="/reset-password" class="text-xs text-primary hover:underline">Forgot password?</a>
        </div>
        <div id="login-error" class="hidden bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3"></div>
        <button type="submit" id="login-btn"
          class="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-green-700 transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
          Log in
        </button>
      </form>

      <!-- Register form -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Name <span class="text-gray-400">(optional)</span></label>
          <input id="reg-name" type="text" placeholder="Alex" autocomplete="name"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="reg-email" type="email" placeholder="you@example.com" required autocomplete="email"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="reg-password" type="password" placeholder="At least 6 characters" required autocomplete="new-password"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
        </div>
        <div id="reg-error" class="hidden bg-red-50 text-red-700 text-sm rounded-lg px-4 py-3"></div>
        <div id="reg-success" class="hidden bg-green-50 text-green-700 text-sm rounded-lg px-4 py-3"></div>
        <button type="submit" id="reg-btn"
          class="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-green-700 transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
          Create free account
        </button>
        <p class="text-xs text-gray-400 text-center">
          By signing up you agree to our <a href="/terms" class="underline">Terms</a> and <a href="/privacy" class="underline">Privacy Policy</a>.
        </p>
      </form>
    </div>

    <p class="text-center text-sm text-gray-400 mt-6">
      3 free meal plans every month. No credit card needed.
    </p>
  </div>

  <script>
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('form-login').classList.toggle('hidden', !isLogin);
      document.getElementById('form-register').classList.toggle('hidden', isLogin);

      const loginTab = document.getElementById('tab-login');
      const regTab = document.getElementById('tab-register');

      if (isLogin) {
        loginTab.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
        loginTab.classList.remove('text-gray-500');
        regTab.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
        regTab.classList.add('text-gray-500');
      } else {
        regTab.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
        regTab.classList.remove('text-gray-500');
        loginTab.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
        loginTab.classList.add('text-gray-500');
      }
    }

    // Support /login#register deep link
    if (window.location.hash === '#register') switchTab('register');

    function setLoading(btn, loading, defaultText) {
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait...' : defaultText;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      errEl.classList.add('hidden');
      setLoading(btn, true, 'Log in');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
          })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          errEl.textContent = data.error || 'Login failed. Please try again.';
          errEl.classList.remove('hidden');
        }
      } catch {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.remove('hidden');
      } finally {
        setLoading(btn, false, 'Log in');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-btn');
      const errEl = document.getElementById('reg-error');
      const successEl = document.getElementById('reg-success');
      errEl.classList.add('hidden');
      successEl.classList.add('hidden');
      setLoading(btn, true, 'Create free account');

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value
          })
        });
        const data = await res.json();
        if (data.success) {
          // Auto-login after registration
          const loginRes = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              email: document.getElementById('reg-email').value,
              password: document.getElementById('reg-password').value
            })
          });
          const loginData = await loginRes.json();
          if (loginData.success) {
            window.location.href = '/dashboard';
          } else {
            successEl.textContent = 'Account created! Please log in.';
            successEl.classList.remove('hidden');
            switchTab('login');
          }
        } else {
          errEl.textContent = data.error || 'Registration failed. Please try again.';
          errEl.classList.remove('hidden');
        }
      } catch {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.remove('hidden');
      } finally {
        setLoading(btn, false, 'Create free account');
      }
    }
  </script>
</body>
</html>
