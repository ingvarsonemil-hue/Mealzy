<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/theme-init.js"></script>
<!-- Cookie consent gate (must load before analytics) -->
<script src="/js/consent.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Updated SEO -->
<title>Pricing | Mealzy — Start Free, Pro from $5.17/mo</title>
<meta name="description" content="Mealzy meal planning pricing. Start free with 1 plan/week. Upgrade to Pro for $62/year ($5.17/mo) or Family for $128/year ($10.67/mo).">

<!-- Open Graph -->
<meta property="og:title" content="Pricing | Mealzy — Feed Your Family for Less">
<meta property="og:description" content="Smart meal planning from $5.17/month. Start with a free plan, upgrade to Pro any time.">
<meta property="og:image" content="https://mealzy.org/card-cta.svg">
<meta property="og:url" content="https://mealzy.org/pricing">
<meta property="og:type" content="website">

<link rel="canonical" href="https://mealzy.org/pricing">

<!-- FAQ Schema — now matches your React page content -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What counts as one plan?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "One plan is a complete 7-day meal schedule with a matched grocery list and price estimate. Free users get one plan per week; Pro and Family users can generate unlimited plans."
      }
    },
    {
      "@type": "Question",
      "name": "Can I cancel anytime?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. You can cancel your subscription at any time from your account settings. You will keep access until the end of your current billing period."
      }
    },
    {
      "@type": "Question",
      "name": "Is there a free trial?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "There is no separate free trial for Pro or Family. Paid subscriptions are billed when you subscribe. You can use Mealzy's free plan before upgrading."
      }
    },
    {
      "@type": "Question",
      "name": "How accurate are price estimates?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Estimates are based on aggregated regional grocery data and update weekly. They are typically within 10–15% of your actual receipt, but local prices and seasonal fluctuations can vary."
      }
    }
  ]
}
</script>

<!-- Product Schema — includes both monthly AND annual -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Mealzy",
  "applicationCategory": "LifestyleApplication",
  "description": "Weekly meal plans that stay inside your grocery budget, with the shopping list generated for you.",
  "url": "https://mealzy.org/pricing",
  "offers": [
    {
      "@type": "Offer",
      "name": "Mealzy Free",
      "price": "0",
      "priceCurrency": "USD"
    },
    {
      "@type": "Offer",
      "name": "Mealzy Pro — Monthly",
      "price": "8.00",
      "priceCurrency": "USD",
      "billingIncrement": "P1M"
    },
    {
      "@type": "Offer",
      "name": "Mealzy Pro — Annual",
      "price": "62.00",
      "priceCurrency": "USD",
      "billingIncrement": "P1Y",
      "description": "Billed annually at $62/year ($5.17/month). Save $34/year."
    },
    {
      "@type": "Offer",
      "name": "Mealzy Family — Monthly",
      "price": "16.00",
      "priceCurrency": "USD",
      "billingIncrement": "P1M"
    },
    {
      "@type": "Offer",
      "name": "Mealzy Family — Annual",
      "price": "128.00",
      "priceCurrency": "USD",
      "billingIncrement": "P1Y",
      "description": "Billed annually at $128/year ($10.67/month). Save $64/year."
    }
  ]
}
</script>

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1a3d2b">

<!-- Stripe payment-link URLs from server env. Intentionally NOT deferred -->
<script src="/stripe-config.js"></script>
</head>

<div id="root"></div>
<script type="module" src="/src/pricing/main.jsx"></script>
</body>
</html>
