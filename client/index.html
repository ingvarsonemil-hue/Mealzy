    { "@type": "Question", "name": "Is Mealzy free?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. The free plan gives you 3 meal plans per month, a full grocery list, and AI coach messages. No credit card required and no sign up needed to try the demo." } },
    { "@type": "Question", "name": "What dietary restrictions does Mealzy support?", "acceptedAnswer": { "@type": "Answer", "text": "Mealzy supports vegetarian, vegan, gluten-free, dairy-free, keto, halal, and high-protein meal plans. You can combine restrictions — for example, vegan and gluten-free together." } },

    { "@type": "Question", "name": "Does Mealzy work outside the US? Does it work in Sweden and Europe?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Mealzy works in 11 languages including Swedish, Norwegian, Danish, German, French, Spanish, Italian, Portuguese, Dutch, Japanese, and English. Grocery cost estimates are localised to your region. Mealzy is used in 10 countries." } },
    { "@type": "Question", "name": "Does Mealzy generate a grocery list?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. After generating your meal plan, Mealzy automatically creates a consolidated grocery list grouped by category with estimated costs. Pro users can export the list as a PDF." } },
    { "@type": "Question", "name": "Can I use Mealzy without signing up?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. The homepage demo works without an account. To save plans and access your full free allowance of 3 plans per month, you can create a free account — no credit card required." } },

  ]
