<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    { "@type": "Question", "name": "How does budget-based planning work?", "acceptedAnswer": { "@type": "Answer", "text": "You set a weekly grocery budget and the week is built to fit inside it. Every ingredient is priced as the plan is assembled, so the seven days you get back already add up to less than your cap — the budget is a constraint the plan is built against, not a total you are handed afterwards and left to check." } },
    { "@type": "Question", "name": "What diets are supported?", "acceptedAnswer": { "@type": "Answer", "text": "Balanced, high protein, vegan and keto, alongside allergies and any ingredients you want kept out entirely. Your choice applies to every meal in the week rather than filtering a fixed plan afterwards, so a vegan week is planned vegan from the start." } },
    { "@type": "Question", "name": "Can I use Mealzy without signing up?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. The sample week on this page re-plans itself as you move the budget, and the preview builds a full week from your own targets without an email address. A free account is what saves your plans and generates new ones — it takes about two minutes and asks for no card." } },
    { "@type": "Question", "name": "What happens after 3 free plans?", "acceptedAnswer": { "@type": "Answer", "text": "Nothing is taken away. Free covers 3 meal plans a month; once they are used the plans you already made stay in your account, and the count resets at the start of the next month. Pro is $8 a month or $62 a year and removes the limit, and Family is $16 a month or $128 a year and adds up to 4 profiles." } },
    { "@type": "Question", "name": "How accurate are the grocery price estimates?", "acceptedAnswer": { "@type": "Answer", "text": "They are estimates, not quotes. Every line is priced from typical supermarket rates and shown as a range, because groceries vary by store, city and week. Pantry staples are counted at the share the week actually uses rather than as a full pack, and quantities scale with your budget, so a bigger week buys more food rather than the same food at a higher price." } }
  ]
}
</script>
